name: wns_flutter_example
description: "Demonstrates how to use the wns_flutter plugin."

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  wns_flutter:
    path: ../

  cupertino_icons: ^1.0.8

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.16.8

flutter:
  uses-material-design: true

msix_config:
  display_name: wns_flutter Example
  publisher_display_name: Partner Center Publisher Name
  identity_name: com.example.wns_flutter_example
  msix_version: 0.0.2.0
  publisher: CN=Partner Center Publisher
  logo_path: windows/runner/resources/app_icon.ico
